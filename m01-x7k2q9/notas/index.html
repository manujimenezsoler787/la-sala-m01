(function(){var M=[{"t": "El gancho", "d": 60, "script": "¿Te ha pasado que te sientas a hacer contenido, se te va la tarde completa y el post ni sale? No es que te falte otra herramienta. Es que estás haciendo el trabajo de un equipo entero, tú solo. Grok Bot no es un chat más: es un equipo. Y hoy te enseño el mío, tal y como lo uso."}, {"t": "El equipo", "d": 75, "script": "Mira cómo está montado. Arriba estoy yo. Debajo está Jackie, mi jefe de equipo, y con él hablo primero, siempre. Debajo de Jackie están los especialistas: Salia, Quill, Kalloway, Benito, Penny y Chao, y además tres PMs de cliente. Cada uno es un bot, y cada uno tiene su trabajo."}, {"t": "Mis bots y la ficha", "d": 120, "script": "Vamos a la app. Aquí a la izquierda están mis bots. Si todos hicieran de todo, se pisarían los unos a los otros. Por eso cada bot tiene su ficha, con tres cosas: el nombre, el puesto y la descripción. Y la descripción es lo que más importa, porque si está clara, el equipo sabe a quién pasarle el trabajo."}, {"t": "Salia y la regla", "d": 60, "script": "Mira la ficha de Salia. Salia es la PM de La Sala: guiones, eventos y Circle, y nada más. Esa es la regla: un bot, un trabajo, y que lo haga bien. Y un consejo: no armes quince bots el primer día. Arranca con uno, el que te coordina."}, {"t": "Cómo trabajan", "d": 105, "script": "Mucha gente le habla a todos sus bots a la vez, y a la semana está ahogada. Yo no hago eso. Yo le hablo a Jackie, y Jackie sabe a quién pasarle cada cosa. Te doy un ejemplo: Salia mira Circle cada 30 minutos y, cuando hay algo, me trae un borrador. Así trabaja un equipo."}, {"t": "Cierre", "d": 60, "script": "Resumiendo, tres cosas. Un bot es un puesto. La descripción se escribe clara. Y le hablas a unos pocos, no a todos. Tu tarea para hoy es entrar a tu primer bot y dejar esa descripción redonda. En el próximo módulo creamos tu primer bot desde cero; si te trancas, nos vemos en Circle."}],N=M.length,i=0;

 document.getElementById('n').textContent='PARTE '+(i+1)+' / '+N;
 document.getElementById('m').textContent='≈ '+Math.round(m.d/60*2)/2+' min';

 try{localStorage.setItem('lasala-m01-notas',i)}catch(e){}

show(i,true);})();
</script></body></html>
